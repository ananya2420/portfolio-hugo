<header x-data="{ open: false, scrolled: false }" 
        @scroll.window="scrolled = (window.pageYOffset > 20)"
        :class="scrolled ? 'bg-gray-950/90 backdrop-blur-md shadow-xl border-b border-gray-800/80' : 'bg-gray-900 border-b border-gray-800'"
        class="sticky top-0 z-50 transition-all duration-300">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="#" class="text-2xl font-extrabold tracking-tight hover:opacity-80 transition">
      <span class="text-white">{{ .Site.Data.portfolio.name }}</span><span class="text-indigo-500">.dev</span>
    </a>
    
    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-8 text-gray-300 font-medium text-sm">
      <a href="#about" class="hover:text-indigo-400 transition-colors">About</a>
      <a href="#skills" class="hover:text-indigo-400 transition-colors">Skills</a>
      <a href="#projects" class="hover:text-indigo-400 transition-colors">Projects</a>
      <a href="#education" class="hover:text-indigo-400 transition-colors">Education & Certs</a>
      <a href="#contact" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition shadow-md hover:shadow-indigo-500/25">
        Get In Touch
      </a>
    </nav>

    <!-- Mobile Hamburger Button -->
    <button @click="open = !open" aria-label="Toggle Menu" class="md:hidden text-gray-300 hover:text-white focus:outline-none p-2 rounded-lg bg-gray-800/50">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        <path x-show="open" x-cloak stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div x-show="open" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 -translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-2"
       @click.away="open = false" 
       class="md:hidden bg-gray-900 border-b border-gray-800 px-6 py-4 space-y-3">
    <a href="#about" @click="open = false" class="block text-gray-300 hover:text-indigo-400 font-medium">About</a>
    <a href="#skills" @click="open = false" class="block text-gray-300 hover:text-indigo-400 font-medium">Skills</a>
    <a href="#projects" @click="open = false" class="block text-gray-300 hover:text-indigo-400 font-medium">Projects</a>
    <a href="#education" @click="open = false" class="block text-gray-300 hover:text-indigo-400 font-medium">Education & Certs</a>
    <a href="#contact" @click="open = false" class="block text-indigo-400 font-semibold pt-2 border-t border-gray-800">Contact Me →</a>
  </div>
</header>
